<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ctOS // Global Official Sec-Grid</title>
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00f3ff">
<style>
  * { box-sizing: border-box; }
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: monospace;
    background: #090d16;
    color: #00f3ff;
    overflow: hidden;
  }
  #map {
    width: 100%;
    height: 100%;
    background: #050811;
  }
  
  /* Filtro ciberpunk para el mapa mundial */
  .leaflet-layer {
    filter: brightness(0.55) invert(1) contrast(2.8) hue-rotate(200deg) saturate(0.35);
  }

  /* Panel de Control HUD */
  .hud-panel {
    position: absolute;
    top: 15px; left: 15px; right: 15px; z-index: 1000;
    max-width: 420px;
    background: rgba(5, 12, 25, 0.95);
    border: 1px solid #00f3ff;
    padding: 12px;
    border-radius: 4px;
    box-shadow: 0 0 15px rgba(0, 243, 255, 0.25);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .hud-title {
    font-size: 0.9rem;
    font-weight: bold;
    letter-spacing: 1px;
    margin: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .search-box {
    display: flex;
    gap: 6px;
    position: relative;
  }
  .hud-input {
    flex: 1;
    background: rgba(0, 243, 255, 0.05);
    border: 1px solid rgba(0, 243, 255, 0.4);
    color: #fff;
    padding: 8px 10px;
    font-family: monospace;
    border-radius: 3px;
    outline: none;
    font-size: 0.85rem;
  }
  .hud-input:focus {
    border-color: #00f3ff;
    box-shadow: 0 0 5px rgba(0, 243, 255, 0.4);
  }
  .hud-btn {
    background: rgba(0, 243, 255, 0.15);
    border: 1px solid #00f3ff;
    color: #00f3ff;
    padding: 8px 12px;
    font-family: monospace;
    font-weight: bold;
    cursor: pointer;
    border-radius: 3px;
    text-transform: uppercase;
    font-size: 0.8rem;
    transition: all 0.2s;
  }
  .hud-btn:hover, .hud-btn.active {
    background: #00f3ff;
    color: #000;
  }
  .hud-btn.official {
    border-color: #00ff66;
    color: #00ff66;
    background: rgba(0, 255, 102, 0.1);
  }
  .hud-btn.official:hover, .hud-btn.official.active {
    background: #00ff66;
    color: #000;
    box-shadow: 0 0 10px #00ff66;
  }

  /* Lista de sugerencias de autocompletado */
  #suggestions-list {
    position: absolute;
    top: 100%; left: 0; right: 0;
    background: rgba(5, 12, 25, 0.98);
    border: 1px solid #00f3ff;
    border-top: none;
    max-height: 180px;
    overflow-y: auto;
    z-index: 1001;
    display: none;
    border-radius: 0 0 4px 4px;
  }
  .suggestion-item {
    padding: 8px 10px;
    font-size: 0.8rem;
    color: #00f3ff;
    cursor: pointer;
    border-bottom: 1px solid rgba(0, 243, 255, 0.1);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .suggestion-item:hover {
    background: rgba(0, 243, 255, 0.2);
    color: #fff;
  }

  /* Panel de Favoritos Lateral */
  .fav-drawer {
    position: absolute;
    top: 15px; right: 15px; z-index: 1000;
    width: 280px;
    background: rgba(5, 12, 25, 0.95);
    border: 1px solid #00f3ff;
    border-radius: 4px;
    padding: 10px;
    box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    max-height: 350px;
    display: flex;
    flex-direction: column;
  }
  .fav-header {
    font-size: 0.8rem;
    font-weight: bold;
    border-bottom: 1px solid rgba(0, 243, 255, 0.3);
    padding-bottom: 5px;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
  }
  .fav-list {
    overflow-y: auto;
    max-height: 280px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .fav-item {
    background: rgba(0, 243, 255, 0.05);
    border: 1px solid rgba(0, 243, 255, 0.2);
    padding: 6px;
    font-size: 0.75rem;
    cursor: pointer;
    border-radius: 2px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .fav-item:hover {
    background: rgba(0, 243, 255, 0.2);
    color: #fff;
  }
  .del-fav {
    background: none;
    border: none;
    color: #ff3366;
    cursor: pointer;
    font-weight: bold;
  }

  /* Botones flotantes */
  .floating-controls {
    position: absolute;
    bottom: 30px; right: 20px; z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .float-btn {
    background: rgba(5, 12, 25, 0.9);
    border: 1px solid #00f3ff;
    color: #00f3ff;
    width: 45px; height: 45px;
    border-radius: 50%;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    transition: all 0.2s;
  }
  .float-btn:hover {
    background: #00f3ff;
    color: #000;
  }

  /* Popups de Terminal */
  .leaflet-popup-content-wrapper {
    background: rgba(5, 12, 25, 0.95) !important;
    color: #fff !important;
    border: 1px solid #00f3ff;
    border-radius: 4px;
    font-family: monospace;
  }
  .leaflet-popup-tip { background: #00f3ff !important; }
  .official-tag { color: #00ff66; font-size: 0.75rem; font-weight: bold; }
  
  .hud-popup-btn {
    margin-top: 6px;
    background: rgba(0, 243, 255, 0.2);
    border: 1px solid #00f3ff;
    color: #00f3ff;
    padding: 4px 8px;
    cursor: pointer;
    font-family: monospace;
    font-size: 0.75rem;
    border-radius: 2px;
    width: 100%;
  }
  .hud-popup-btn:hover {
    background: #00f3ff;
    color: #000;
  }
</style>
</head>
<body>

  <div class="hud-panel">
    <h3 class="hud-title">ctOS // OFFICIAL DATA GRID</h3>
    <div class="search-box">
      <input type="text" id="ubicacion-input" class="hud-input" placeholder="Buscar país, ciudad o calle..." autocomplete="off" oninput="sugerirLugares(this.value)" onkeypress="handleKeyPress(event)">
      <button class="hud-btn" onclick="buscarLugarDirecto()">Ir</button>
      <div id="suggestions-list"></div>
    </div>
    <button class="hud-btn official" id="btn-toggle-oficial" onclick="toggleCapasOficiales()" style="margin-top: 4px;">Sincronizar Datos Oficiales (GeoJSON)</button>
  </div>

  <!-- Panel de Favoritos -->
  <div class="fav-drawer">
    <div class="fav-header"><span>// OBJETIVOS FAVORITOS</span><span id="fav-count">0</span></div>
    <div class="fav-list" id="lista-favoritos">
      <!-- Se llena por JS -->
    </div>
  </div>

  <div id="map"></div>

  <div class="floating-controls">
    <button class="float-btn" onclick="centrarMiUbicacion()" title="Mi ubicación">📍</button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: false }).setView([-31.4167, -64.1833], 13);
    L.control.zoom({ position: 'topright' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let marcadorActual = null;
    let capaOficialesGrupo = L.layerGroup();
    let datosOficialesActivos = false;
    let timeoutBusqueda = null;
    
    // Almacenamiento local de favoritos
    let favoritos = JSON.parse(localStorage.getItem('ctos_favoritos')) || [];
    renderizarFavoritos();

    const registrosOficialesGlobales = [
      {
        type: "Feature",
        geometry: { type: "Point", coordinates: [-64.1810, -31.4135] },
        properties: { fuente: "Portal Open Data Gubernamental", entidad: "Comisaría / Monitoreo Oficial", desc: "Sector monitoreado por bases de datos de seguridad pública.", nivel: "Oficial Verificado" }
      },
      {
        type: "Feature",
        geometry: { type: "Point", coordinates: [-74.0060, 40.7128] },
        properties: { fuente: "NYC Open Data / NYPD Metrics", entidad: "Central Precinct Sector", desc: "Datos oficiales de reportes urbanos metropolitanos.", nivel: "Oficial Verificado" }
      }
    ];

    function cargarDatosOficiales() {
      capaOficialesGrupo.clearLayers();
      L.geoJSON({
        type: "FeatureCollection",
        features: registrosOficialesGlobales
      }, {
        pointToLayer: function (feature, latlng) {
          return L.circleMarker(latlng, {
            radius: 8,
            fillColor: "#00ff66",
            color: "#fff",
            weight: 1,
            opacity: 1,
            fillOpacity: 0.8
          });
        },
        onEachFeature: function (feature, layer) {
          layer.bindPopup(`
            <div style="font-size: 0.85rem; line-height: 1.4;">
              <span class="official-tag">[FUENTES OFICIALES]</span><br>
              <b style="color:#00f3ff;">${feature.properties.entidad}</b><br>
              <b>Fuente:</b> ${feature.properties.fuente}<br><br>
              <em>${feature.properties.desc}</em>
            </div>
          `);
        }
      }).addTo(capaOficialesGrupo);
    }

    function toggleCapasOficiales() {
      datosOficialesActivos = !datosOficialesActivos;
      const btn = document.getElementById('btn-toggle-oficial');
      if (datosOficialesActivos) {
        cargarDatosOficiales();
        capaOficialesGrupo.addTo(map);
        btn.classList.add('active');
        btn.textContent = "Desconectar Datos Oficiales";
      } else {
        map.removeLayer(capaOficialesGrupo);
        btn.classList.remove('active');
        btn.textContent = "Sincronizar Datos Oficiales (GeoJSON)";
      }
    }

    // Evento de clic en cualquier parte del mapa (Reverse Geocoding para calles y lugares)
    map.on('click', function(e) {
      const lat = e.latlng.lat;
      const lon = e.latlng.lng;

      fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
        .then(res => res.json())
        .then(data => {
          const nombreLugar = data.display_name || "Ubicación sin registro exacto";
          
          if (marcadorActual) map.removeLayer(marcadorActual);
          marcadorActual = L.marker([lat, lon]).addTo(map)
            .bindPopup(`
              <div style="font-size: 0.85rem; line-height: 1.4;">
                <b style="color:#00f3ff;">[ANÁLISIS DE CALLE / SECTOR]</b><br>
                ${nombreLugar}<br><br>
                <button class="hud-popup-btn" onclick="agregarFavorito('${nombreLugar.replace(/'/g, "\\'")}', ${lat}, ${lon})">[+] Añadir a Favoritos</button>
              </div>
            `)
            .openPopup();
        })
        .catch(() => {
          alert("Error al conectar con la red de mapeo.");
        });
    });

    function sugerirLugares(query) {
      clearTimeout(timeoutBusqueda);
      const lista = document.getElementById('suggestions-list');
      
      if (!query || query.length < 2) {
        lista.style.display = 'none';
        lista.innerHTML = '';
        return;
      }

      timeoutBusqueda = setTimeout(() => {
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`)
          .then(res => res.json())
          .then(data => {
            lista.innerHTML = '';
            if (data && data.length > 0) {
              data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.textContent = item.display_name;
                div.onclick = () => seleccionarSugerencia(item.lat, item.lon, item.display_name);
                lista.appendChild(div);
              });
              lista.style.display = 'block';
            } else {
              lista.style.display = 'none';
            }
          })
          .catch(() => { lista.style.display = 'none'; });
      }, 300);
    }

    function seleccionarSugerencia(lat, lon, nombre) {
      document.getElementById('ubicacion-input').value = nombre;
      document.getElementById('suggestions-list').style.display = 'none';
      moverMapa(parseFloat(lat), parseFloat(lon), nombre);
    }

    function moverMapa(lat, lon, nombre) {
      map.setView([lat, lon], 15);
      if (marcadorActual) map.removeLayer(marcadorActual);
      marcadorActual = L.marker([lat, lon]).addTo(map)
        .bindPopup(`
          <div style="font-size: 0.85rem; line-height: 1.4;">
            <b style="color:#00f3ff;">Objetivo Oficial:</b><br>${nombre}<br><br>
            <button class="hud-popup-btn" onclick="agregarFavorito('${nombre.replace(/'/g, "\\'")}', ${lat}, ${lon})">[+] Añadir a Favoritos</button>
          </div>
        `)
        .openPopup();
    }

    function buscarLugarDirecto() {
      const query = document.getElementById('ubicacion-input').value;
      if (!query) return;
      document.getElementById('suggestions-list').style.display = 'none';

      fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
        .then(res => res.json())
        .then(data => {
          if (data && data.length > 0) {
            moverMapa(parseFloat(data[0].lat), parseFloat(data[0].lon), data[0].display_name);
          } else {
            alert("Ubicación no encontrada en los registros.");
          }
        });
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        document.getElementById('suggestions-list').style.display = 'none';
        buscarLugarDirecto();
      }
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-box')) {
        document.getElementById('suggestions-list').style.display = 'none';
      }
    });

    function agregarFavorito(nombre, lat, lon) {
      // Evitar duplicados exactos
      if (!favoritos.some(f => f.lat === lat && f.lon === lon)) {
        favoritos.push({ nombre, lat, lon });
        localStorage.setItem('ctos_favoritos', JSON.stringify(favoritos));
        renderizarFavoritos();
        alert("Objetivo guardado en favoritos.");
      } else {
        alert("Este objetivo ya está en favoritos.");
      }
    }

    function eliminarFavorito(index) {
      favoritos.splice(index, 1);
      localStorage.setItem('ctos_favoritos', JSON.stringify(favoritos));
      renderizarFavoritos();
    }

    function renderizarFavoritos() {
      const contenedor = document.getElementById('lista-favoritos');
      const contador = document.getElementById('fav-count');
      contenedor.innerHTML = '';
      contador.textContent = favoritos.length;

      if (favoritos.length === 0) {
        contenedor.innerHTML = '<div style="font-size: 0.75rem; color: rgba(0,243,255,0.4); padding: 4px;">Sin objetivos guardados</div>';
        return;
      }

      favoritos.forEach((fav, index) => {
        const div = document.createElement('div');
        div.className = 'fav-item';
        div.innerHTML = `
          <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 210px;" onclick="moverMapa(${fav.lat}, ${fav.lon}, '${fav.nombre.replace(/'/g, "\\'")}')" title="${fav.nombre}">${fav.nombre}</span>
          <button class="del-fav" onclick="event.stopPropagation(); eliminarFavorito(${index})">×</button>
        `;
        div.onclick = () => moverMapa(fav.lat, fav.lon, fav.nombre);
        contenedor.appendChild(div);
      });
    }

    function centrarMiUbicacion() {
      if (!navigator.geolocation) {
        alert("Geolocalización no soportada.");
        return;
      }
      navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        moverMapa(lat, lon, "Ubicación Actual (GPS Oficial)");
      }, () => {
        alert("No se pudo obtener tu ubicación.");
      }, { enableHighAccuracy: true });
    }
  </script>

  <!-- Service Worker PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log("SW error", err));
      });
    }
  </script>
</body>
</html>
