<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ctOS // Global Official Sec-Grid</title>
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00f3ff">
<style>
  * { box-sizing: border-box; }
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: monospace;
    background: #090d16;
    color: #00f3ff;
    overflow: hidden;
  }
  #map {
    width: 100%;
    height: 100%;
    background: #050811;
  }
  
  /* Filtro ciberpunk para el mapa mundial */
  .leaflet-layer {
    filter: brightness(0.55) invert(1) contrast(2.8) hue-rotate(200deg) saturate(0.35);
  }

  /* Panel de Control HUD */
  .hud-panel {
    position: absolute;
    top: 15px; left: 15px; right: 15px; z-index: 1000;
    max-width: 420px;
    background: rgba(5, 12, 25, 0.95);
    border: 1px solid #00f3ff;
    padding: 12px;
    border-radius: 4px;
    box-shadow: 0 0 15px rgba(0, 243, 255, 0.25);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .hud-title {
    font-size: 0.9rem;
    font-weight: bold;
    letter-spacing: 1px;
    margin: 0;
  }
  .search-box {
    display: flex;
    gap: 6px;
  }
  .hud-input {
    flex: 1;
    background: rgba(0, 243, 255, 0.05);
    border: 1px solid rgba(0, 243, 255, 0.4);
    color: #fff;
    padding: 8px 10px;
    font-family: monospace;
    border-radius: 3px;
    outline: none;
    font-size: 0.85rem;
  }
  .hud-input:focus {
    border-color: #00f3ff;
    box-shadow: 0 0 5px rgba(0, 243, 255, 0.4);
  }
  .hud-btn {
    background: rgba(0, 243, 255, 0.15);
    border: 1px solid #00f3ff;
    color: #00f3ff;
    padding: 8px 12px;
    font-family: monospace;
    font-weight: bold;
    cursor: pointer;
    border-radius: 3px;
    text-transform: uppercase;
    font-size: 0.8rem;
    transition: all 0.2s;
  }
  .hud-btn:hover, .hud-btn.active {
    background: #00f3ff;
    color: #000;
  }
  .hud-btn.official {
    border-color: #00ff66;
    color: #00ff66;
    background: rgba(0, 255, 102, 0.1);
  }
  .hud-btn.official:hover, .hud-btn.official.active {
    background: #00ff66;
    color: #000;
    box-shadow: 0 0 10px #00ff66;
  }

  /* Botones flotantes */
  .floating-controls {
    position: absolute;
    bottom: 30px; right: 20px; z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .float-btn {
    background: rgba(5, 12, 25, 0.9);
    border: 1px solid #00f3ff;
    color: #00f3ff;
    width: 45px; height: 45px;
    border-radius: 50%;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    transition: all 0.2s;
  }
  .float-btn:hover {
    background: #00f3ff;
    color: #000;
  }

  /* Popups de Terminal */
  .leaflet-popup-content-wrapper {
    background: rgba(5, 12, 25, 0.95) !important;
    color: #fff !important;
    border: 1px solid #00f3ff;
    border-radius: 4px;
    font-family: monospace;
  }
  .leaflet-popup-tip { background: #00f3ff !important; }
  .official-tag { color: #00ff66; font-size: 0.75rem; font-weight: bold; }
</style>
</head>
<body>

  <div class="hud-panel">
    <h3 class="hud-title">ctOS // OFFICIAL DATA GRID</h3>
    <div class="search-box">
      <input type="text" id="ubicacion-input" class="hud-input" placeholder="Buscar país, ciudad o región..." onkeypress="handleKeyPress(event)">
      <button class="hud-btn" onclick="buscarLugar()">Ir</button>
    </div>
    <button class="hud-btn official" id="btn-toggle-oficial" onclick="toggleCapasOficiales()" style="margin-top: 4px;">Sincronizar Datos Oficiales (GeoJSON)</button>
  </div>

  <div id="map"></div>

  <div class="floating-controls">
    <button class="float-btn" onclick="centrarMiUbicacion()" title="Mi ubicación">📍</button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: false }).setView([-31.4167, -64.1833], 3);
    L.control.zoom({ position: 'topright' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let marcadorActual = null;
    let capaOficialesGrupo = L.layerGroup();
    let datosOficialesActivos = false;

    // Estructura universal preparada para ingerir datos oficiales globales (GeoJSON / APIs abiertas gubernamentales)
    const registrosOficialesGlobales = [
      {
        type: "Feature",
        geometry: { type: "Point", coordinates: [-64.1810, -31.4135] },
        properties: { fuente: "Portal Open Data Gubernamental", entidad: "Comisaría / Monitoreo Oficial", desc: "Sector monitoreado por bases de datos de seguridad pública.", nivel: "Oficial Verificado" }
      },
      {
        type: "Feature",
        geometry: { type: "Point", coordinates: [-74.0060, 40.7128] },
        properties: { fuente: "NYC Open Data / NYPD Metrics", entidad: "Central Precinct Sector", desc: "Datos oficiales de reportes urbanos metropolitanos.", nivel: "Oficial Verificado" }
      },
      {
        type: "Feature",
        geometry: { type: "Point", coordinates: [-0.1278, 51.5074] },
        properties: { fuente: "Metropolitan Police UK Open Stats", entidad: "London Central Grid", desc: "Estadísticas oficiales de seguridad integradas.", nivel: "Oficial Verificado" }
      }
    ];

    function cargarDatosOficiales() {
      capaOficialesGrupo.clearLayers();

      // Procesamiento estándar GeoJSON compatible con fuentes oficiales de todo el mundo
      L.geoJSON({
        type: "FeatureCollection",
        features: registrosOficialesGlobales
      }, {
        pointToLayer: function (feature, latlng) {
          return L.circleMarker(latlng, {
            radius: 8,
            fillColor: "#00ff66",
            color: "#fff",
            weight: 1,
            opacity: 1,
            fillOpacity: 0.8
          });
        },
        onEachFeature: function (feature, layer) {
          layer.bindPopup(`
            <div style="font-size: 0.85rem; line-height: 1.4;">
              <span class="official-tag">[FUENTES OFICIALES]</span><br>
              <b style="color:#00f3ff;">${feature.properties.entidad}</b><br>
              <b>Fuente:</b> ${feature.properties.fuente}<br><br>
              <em>${feature.properties.desc}</em>
            </div>
          `);
        }
      }).addTo(capaOficialesGrupo);
    }

    function toggleCapasOficiales() {
      datosOficialesActivos = !datosOficialesActivos;
      const btn = document.getElementById('btn-toggle-oficial');

      if (datosOficialesActivos) {
        cargarDatosOficiales();
        capaOficialesGrupo.addTo(map);
        btn.classList.add('active');
        btn.textContent = "Desconectar Datos Oficiales";
      } else {
        map.removeLayer(capaOficialesGrupo);
        btn.classList.remove('active');
        btn.textContent = "Sincronizar Datos Oficiales (GeoJSON)";
      }
    }

    function buscarLugar() {
      const query = document.getElementById('ubicacion-input').value;
      if (!query) return;

      fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
        .then(res => res.json())
        .then(data => {
          if (data && data.length > 0) {
            const lat = parseFloat(data[0].lat);
            const lon = parseFloat(data[0].lon);
            map.setView([lat, lon], 12);

            if (marcadorActual) map.removeLayer(marcadorActual);
            marcadorActual = L.marker([lat, lon]).addTo(map)
              .bindPopup(`<b>Objetivo Oficial:</b><br>${data[0].display_name}`)
              .openPopup();
          } else {
            alert("Ubicación no encontrada en los registros.");
          }
        });
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') buscarLugar();
    }

    function centrarMiUbicacion() {
      if (!navigator.geolocation) {
        alert("Geolocalización no soportada.");
        return;
      }
      navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        map.setView([lat, lon], 14);

        if (marcadorActual) map.removeLayer(marcadorActual);
        marcadorActual = L.marker([lat, lon]).addTo(map)
          .bindPopup("<b>Ubicación Actual (GPS Oficial)</b>")
          .openPopup();
      }, () => {
        alert("No se pudo obtener tu ubicación.");
      }, { enableHighAccuracy: true });
    }
  </script>

  <!-- Service Worker PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log("SW error", err));
      });
    }
  </script>
</body>
</html>
