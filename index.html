<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ctOS // Global Map</title>
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; }
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: monospace;
    background: #090d16;
    color: #00f3ff;
    overflow: hidden;
  }
  #map {
    width: 100%;
    height: 100%;
    background: #050811;
  }
  
  /* Panel de Búsqueda y Controles */
  .hud-panel {
    position: absolute;
    top: 15px; left: 15px; right: 15px; z-index: 1000;
    max-width: 400px;
    background: rgba(5, 12, 25, 0.9);
    border: 1px solid #00f3ff;
    padding: 12px;
    border-radius: 4px;
    box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .hud-title {
    font-size: 0.9rem;
    font-weight: bold;
    letter-spacing: 1px;
    margin: 0;
  }
  .search-box {
    display: flex;
    gap: 6px;
  }
  .hud-input {
    flex: 1;
    background: rgba(0, 243, 255, 0.05);
    border: 1px solid rgba(0, 243, 255, 0.4);
    color: #fff;
    padding: 8px 10px;
    font-family: monospace;
    border-radius: 3px;
    outline: none;
    font-size: 0.85rem;
  }
  .hud-input:focus {
    border-color: #00f3ff;
    box-shadow: 0 0 5px rgba(0, 243, 255, 0.4);
  }
  .hud-btn {
    background: rgba(0, 243, 255, 0.15);
    border: 1px solid #00f3ff;
    color: #00f3ff;
    padding: 8px 12px;
    font-family: monospace;
    font-weight: bold;
    cursor: pointer;
    border-radius: 3px;
    text-transform: uppercase;
    font-size: 0.8rem;
    transition: all 0.2s;
  }
  .hud-btn:hover {
    background: #00f3ff;
    color: #000;
  }

  /* Botón flotante para mi ubicación (abajo a la derecha) */
  .gps-btn {
    position: absolute;
    bottom: 30px; right: 20px; z-index: 1000;
    background: rgba(5, 12, 25, 0.9);
    border: 1px solid #00f3ff;
    color: #00f3ff;
    width: 45px; height: 45px;
    border-radius: 50%;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    transition: all 0.2s;
  }
  .gps-btn:hover {
    background: #00f3ff;
    color: #000;
  }
</style>
</head>
<body>

  <div class="hud-panel">
    <h3 class="hud-title">ctOS // BUSCADOR GLOBAL</h3>
    <div class="search-box">
      <input type="text" id="ubicacion-input" class="hud-input" placeholder="Buscar lugar o ciudad..." onkeypress="handleKeyPress(event)">
      <button class="hud-btn" onclick="buscarLugar()">Ir</button>
    </div>
  </div>

  <div id="map"></div>

  <button class="gps-btn" onclick="centrarMiUbicacion()" title="Usar mi ubicación">📍</button>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Inicializar mapa (por defecto en Córdoba, Argentina)
    const map = L.map('map', { zoomControl: false }).setView([-31.4167, -64.1833], 13);

    L.control.zoom({ position: 'topright' }).addTo(map);

    // Capa base de OpenStreetMap (100% libre y global)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let marcadorActual = null;

    // Función para buscar lugares en todo el mundo usando la API pública de Nominatim (OSM)
    function buscarLugar() {
      const query = document.getElementById('ubicacion-input').value;
      if (!query) return;

      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;

      fetch(url)
        .then(response => response.json())
        .then(data => {
          if (data && data.length > 0) {
            const lat = parseFloat(data[0].lat);
            const lon = parseFloat(data[0].lon);
            const displayName = data[0].display_name;

            // Mover el mapa a la ubicación encontrada
            map.setView([lat, lon], 14);

            // Poner o mover un marcador en el lugar
            if (marcadorActual) {
              map.removeLayer(marcadorActual);
            }
            marcadorActual = L.marker([lat, lon]).addTo(map)
              .bindPopup(`<b>Ubicación:</b><br>${displayName}`)
              .openPopup();
          } else {
            alert("No se encontró la ubicación.");
          }
        })
        .catch(err => {
          console.error("Error en la búsqueda:", err);
          alert("Error al conectar con el servicio de búsqueda.");
        });
    }

    // Permitir buscar presionando la tecla "Enter"
    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        buscarLugar();
      }
    }

    // Función para usar el GPS del dispositivo y centrar el mapa
    function centrarMiUbicacion() {
      if (!navigator.geolocation) {
        alert("Tu navegador no soporta geolocalización.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          map.setView([lat, lon], 15);

          if (marcadorActual) {
            map.removeLayer(marcadorActual);
          }
          marcadorActual = L.marker([lat, lon]).addTo(map)
            .bindPopup("<b>Estás aquí</b>")
            .openPopup();
        },
        () => {
          alert("No se pudo obtener tu ubicación. Verifica los permisos del navegador.");
        },
        { enableHighAccuracy: true }
      );
    }
  </script>
</body>
</html>
