<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ctOS // Global Sec-Grid</title>
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00f3ff">
<style>
  * { box-sizing: border-box; }
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: monospace;
    background: #090d16;
    color: #00f3ff;
    overflow: hidden;
  }
  #map {
    width: 100%;
    height: 100%;
    background: #050811;
  }
  
  /* Filtro ciberpunk para el mapa mundial */
  .leaflet-layer {
    filter: brightness(0.55) invert(1) contrast(2.8) hue-rotate(200deg) saturate(0.35);
  }

  /* Panel de Control HUD */
  .hud-panel {
    position: absolute;
    top: 15px; left: 15px; right: 15px; z-index: 1000;
    max-width: 420px;
    background: rgba(5, 12, 25, 0.92);
    border: 1px solid #00f3ff;
    padding: 12px;
    border-radius: 4px;
    box-shadow: 0 0 15px rgba(0, 243, 255, 0.25);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .hud-title {
    font-size: 0.9rem;
    font-weight: bold;
    letter-spacing: 1px;
    margin: 0;
  }
  .search-box {
    display: flex;
    gap: 6px;
  }
  .hud-input {
    flex: 1;
    background: rgba(0, 243, 255, 0.05);
    border: 1px solid rgba(0, 243, 255, 0.4);
    color: #fff;
    padding: 8px 10px;
    font-family: monospace;
    border-radius: 3px;
    outline: none;
    font-size: 0.85rem;
  }
  .hud-input:focus {
    border-color: #00f3ff;
    box-shadow: 0 0 5px rgba(0, 243, 255, 0.4);
  }
  .hud-btn {
    background: rgba(0, 243, 255, 0.15);
    border: 1px solid #00f3ff;
    color: #00f3ff;
    padding: 8px 12px;
    font-family: monospace;
    font-weight: bold;
    cursor: pointer;
    border-radius: 3px;
    text-transform: uppercase;
    font-size: 0.8rem;
    transition: all 0.2s;
  }
  .hud-btn:hover, .hud-btn.active {
    background: #00f3ff;
    color: #000;
  }
  .hud-btn.danger {
    border-color: #ff3333;
    color: #ff3333;
    background: rgba(255, 51, 51, 0.1);
  }
  .hud-btn.danger:hover, .hud-btn.danger.active {
    background: #ff3333;
    color: #fff;
    box-shadow: 0 0 10px #ff3333;
  }

  /* Botones flotantes */
  .floating-controls {
    position: absolute;
    bottom: 30px; right: 20px; z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .float-btn {
    background: rgba(5, 12, 25, 0.9);
    border: 1px solid #00f3ff;
    color: #00f3ff;
    width: 45px; height: 45px;
    border-radius: 50%;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    transition: all 0.2s;
  }
  .float-btn:hover {
    background: #00f3ff;
    color: #000;
  }

  /* Popups de Terminal */
  .leaflet-popup-content-wrapper {
    background: rgba(5, 12, 25, 0.95) !important;
    color: #fff !important;
    border: 1px solid #00f3ff;
    border-radius: 4px;
    font-family: monospace;
  }
  .leaflet-popup-tip { background: #00f3ff !important; }
  .risk-high { color: #ff3333; font-weight: bold; }
  .risk-med { color: #ff9900; font-weight: bold; }
  .risk-low { color: #00ff66; font-weight: bold; }
</style>
</head>
<body>

  <div class="hud-panel">
    <h3 class="hud-title">ctOS // GLOBAL NET-GRID</h3>
    <div class="search-box">
      <input type="text" id="ubicacion-input" class="hud-input" placeholder="Buscar cualquier ciudad del mundo..." onkeypress="handleKeyPress(event)">
      <button class="hud-btn" onclick="buscarLugar()">Ir</button>
    </div>
    <button class="hud-btn danger" id="btn-toggle-riesgo" onclick="toggleCapaRiesgo()" style="margin-top: 4px;">Activar Análisis Global de Riesgo</button>
  </div>

  <div id="map"></div>

  <div class="floating-controls">
    <button class="float-btn" onclick="centrarMiUbicacion()" title="Mi ubicación">📍</button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: false }).setView([-31.4167, -64.1833], 3); // Vista global inicial del planeta
    L.control.zoom({ position: 'topright' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let marcadorActual = null;
    let capaZonasGlobal = L.layerGroup();
    let riesgoActivo = false;

    // Base de datos simulada global (puntos estratégicos en diferentes continentes del mundo)
    const zonasGlobalesData = [
      // Argentina / Córdoba
      { lat: -31.4135, lon: -64.1810, nombre: "Córdoba - Nueva Córdoba", nivel: "baja", desc: "Zona urbana de alto flujo. Precaución estándar por hurtos.", radio: 2500 },
      // EE.UU / New York
      { lat: 40.7128, lon: -74.0060, nombre: "New York - Manhattan Zone", nivel: "media", desc: "Área metropolitana monitoreada. Alerta por carteristas en zonas turísticas.", radio: 5000 },
      // Reino Unido / Londres
      { lat: 51.5074, lon: -0.1278, nombre: "London - Central Grid", nivel: "baja", desc: "Alta densidad de cámaras y patrullaje de seguridad.", radio: 4000 },
      // Japón / Tokio
      { lat: 35.6762, lon: 139.6503, nombre: "Tokyo - Shinjuku Sector", nivel: "baja", desc: "Zona comercial ultra segura con bajo índice de criminalidad violenta.", radio: 4500 },
      // México / CDMX
      { lat: 19.4326, lon: -99.1332, nombre: "Ciudad de México - Centro", nivel: "alta", desc: "Zona de atención prioritaria. Reportes frecuentes de actividad delictiva.", radio: 6000 },
      // Brasil / Río de Janeiro
      { lat: -22.9068, lon: -43.1729, nombre: "Río de Janeiro - Zona Sul Sector", nivel: "alta", desc: "Sector con alertas de seguridad activas en perímetros específicos.", radio: 5500 }
    ];

    function cargarZonasGlobales() {
      capaZonasGlobal.clearLayers();

      zonasGlobalesData.forEach(zona => {
        let color = "#00ff66";
        let textoRiesgo = '<span class="risk-low">ESTADO: SEGURO (Bajo riesgo)</span>';

        if (zona.nivel === 'media') {
          color = "#ff9900";
          textoRiesgo = '<span class="risk-med">ESTADO: PRECAUCIÓN (Riesgo moderado)</span>';
        } else if (zona.nivel === 'alta') {
          color = "#ff3333";
          textoRiesgo = '<span class="risk-high">ESTADO: ALERTA ROJA (Zona peligrosa)</span>';
        }

        const circle = L.circle([zona.lat, zona.lon], {
          color: color,
          fillColor: color,
          fillOpacity: 0.3,
          radius: zona.radio,
          weight: 2
        });

        circle.bindPopup(`
          <div style="font-size: 0.85rem; line-height: 1.4;">
            <b style="color:#00f3ff; font-size: 0.95rem;">${zona.nombre}</b><br>
            ${textoRiesgo}<br><br>
            <em>${zona.desc}</em>
          </div>
        `);

        capaZonasGlobal.addLayer(circle);
      });
    }

    function toggleCapaRiesgo() {
      riesgoActivo = !riesgoActivo;
      const btn = document.getElementById('btn-toggle-riesgo');

      if (riesgoActivo) {
        cargarZonasGlobales();
        capaZonasGlobal.addTo(map);
        btn.classList.add('active');
        btn.textContent = "Desactivar Análisis Global";
      } else {
        map.removeLayer(capaZonasGlobal);
        btn.classList.remove('active');
        btn.textContent = "Activar Análisis Global de Riesgo";
      }
    }

    function buscarLugar() {
      const query = document.getElementById('ubicacion-input').value;
      if (!query) return;

      fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
        .then(res => res.json())
        .then(data => {
          if (data && data.length > 0) {
            const lat = parseFloat(data[0].lat);
            const lon = parseFloat(data[0].lon);
            map.setView([lat, lon], 12); // Hace zoom a la ciudad buscada en cualquier parte del mundo

            if (marcadorActual) map.removeLayer(marcadorActual);
            marcadorActual = L.marker([lat, lon]).addTo(map)
              .bindPopup(`<b>Objetivo Localizado:</b><br>${data[0].display_name}`)
              .openPopup();
          } else {
            alert("Ubicación no encontrada en la red.");
          }
        });
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') buscarLugar();
    }

    function centrarMiUbicacion() {
      if (!navigator.geolocation) {
        alert("Geolocalización no soportada.");
        return;
      }
      navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        map.setView([lat, lon], 14);

        if (marcadorActual) map.removeLayer(marcadorActual);
        marcadorActual = L.marker([lat, lon]).addTo(map)
          .bindPopup("<b>Ubicación Actual (GPS)</b>")
          .openPopup();
      }, () => {
        alert("No se pudo obtener tu ubicación.");
      }, { enableHighAccuracy: true });
    }
  </script>

  <!-- Service Worker para PWA Global -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log("SW error", err));
      });
    }
  </script>
</body>
</html>
